[package]
name = "tinylink"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SDG + PDG unification bridge — links OpenTelemetry service graphs to code-level dependence graphs"
readme = "README.md"
repository = "https://github.com/steetstyle/tinylink"
keywords = ["opentelemetry", "static-analysis", "tracing", "dependency-graph", "dotnet"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[dependencies]
tiny-pdg-cs = { git = "https://github.com/steetstyle/tinypdg-cs.git" }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
# Direct dependency: PDG drill-down walks the C# syntax tree to locate a
# method declaration's line range. Keep the version in lockstep with
# tiny-pdg-cs (tree-sitter 0.25 / tree-sitter-c-sharp 0.23).
tree-sitter = "0.25"
# `bundled` compiles SQLite from source so the binary has no system dependency.
rusqlite = { version = "0.37", features = ["bundled"] }
# Stable content hash so an unchanged index is reused instead of reparsed.
blake3 = "1"
# MCP server (`tinylink serve`). Pinned to the same rmcp/schemars versions as
# tiny-pdg-cs so one client — and tiny-rca — can drive both.
rmcp = { version = "3", features = ["server", "transport-io"], optional = true }
# Streamable HTTP transport for `serve --http`. The standalone SSE transport is
# deprecated in the MCP spec and the SDK ships no server for it.
axum = { version = "0.8", optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"

[features]
default = ["online"]
online = ["reqwest", "tokio"]
# `serve` needs a tokio runtime; the index and CLI paths do not.
mcp = ["dep:rmcp", "dep:schemars"]
mcp-http = ["mcp", "rmcp/transport-streamable-http-server", "dep:axum"]

[[bench]]
name = "bench_sdg"
path = "benches/bench_sdg.rs"
harness = false

[[bench]]
name = "bench_link"
path = "benches/bench_link.rs"
harness = false
